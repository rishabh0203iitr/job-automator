[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-automator"
version = "0.1.0"
description = "AI-powered job search and application automator"
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "google-genai>=1.0.0",
    "python-jobspy>=1.1.0",
    "playwright>=1.40.0",
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pymupdf>=1.23.0",
    "python-docx>=1.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.25.0"]
openai = ["openai>=1.0.0"]
all = ["anthropic>=0.25.0", "openai>=1.0.0"]

[project.scripts]
job = "job_automator.__main__:main"

[tool.setuptools.packages.find]
include = ["job_automator*"]
